apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  labels:
    app: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
data:
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
