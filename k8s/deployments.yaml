apiVersion: apps/v1
kind: Deployment
metadata:
  name: courseapi-deployment
  labels:
    app: courseapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: courseapi
  template:
    metadata:
      labels:
        app: courseapi
    spec:
      containers:
        - name: courseapi
          image: prospjx/courseapi:latest
          ports:
            - containerPort: 8001
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: courseapi-configmap
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: courseapi-configmap
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: courseapi-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
